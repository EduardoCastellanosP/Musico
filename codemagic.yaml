workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    environment:
      groups:
        - my_credentials # Reemplaza por el nombre exacto de tu grupo de secretos en Codemagic
      
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mussy.mussyconnect

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          cd $FCI_BUILD_DIR
          flutter pub get

      - name: Instalar CocoaPods
        script: |
          cd $FCI_BUILD_DIR/ios
          pod install

      - name: Compilar IPA para TestFlight con Dart Defines
        script: |
          cd $FCI_BUILD_DIR
          flutter build ipa --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log