workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    environment:
      vars:
        ENV_FILE_BASE64: "$ENV_FILE_BASE64"
      groups:
        - my_credentials
      
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mussy.mussyconnect

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:

     - name: Crear archivo .env
        script: |
          echo "Creando archivo .env en la raíz..."
          echo "$ENV_FILE_BASE64" | base64 -D > .env
          if [ -f .env ]; then
            echo "¡El archivo .env se creó exitosamente!"
          else
            echo "Error: El archivo .env no se pudo crear."
            exit 1
          fi

      - name: Obtener dependencias Flutter
        script: |
          flutter pub get

      - name: Verificar Bundle ID
        script: |
          echo "======================================"
          echo "BUNDLE ID CONFIGURADO:"
          echo "com.mussy.mussyconnect"
          echo "======================================"

          grep -R "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Instalar CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Configurar firma de iOS
        script: |
          echo "Configurando certificados y provisioning profiles..."
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log