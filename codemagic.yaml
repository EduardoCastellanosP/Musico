workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    environment:
      groups:
        - my_credentials
      
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mussy.mussyconnect

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Crear y verificar archivo .env
        script: |
          echo "Directorio actual:"
          pwd
          echo "Creando archivo .env desde variable base64..."
          
          # Forzamos la ubicación exacta en la raíz del proyecto clonado
          echo "$ENV_FILE_BASE64" | base64 -d > /Users/builder/clone/.env
          
          if [ -f "/Users/builder/clone/.env" ]; then
            echo "¡Éxito! El archivo .env existe en la ruta absoluta."
            ls -la /Users/builder/clone/.env
          else
            echo "¡ALERTA! El archivo .env no existe."
            exit 1
          fi

      - name: Obtener dependencias Flutter
        script: |
          flutter pub get

      - name: Verificar Bundle ID
        script: |
          echo "======================================"
          echo "BUNDLE ID CONFIGURADO:"
          echo "com.mussy.mussyconnect"
          echo "======================================"

          grep -R "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Instalar CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Configurar firma de iOS
        script: |
          echo "Configurando certificados y provisioning profiles..."
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log