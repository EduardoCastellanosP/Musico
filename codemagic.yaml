workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      groups:
        - my_credentials # Nombre del grupo donde guardaste ENV_FILE_BASE64 en Codemagic
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Decodificar y crear archivo .env
        script: |
          echo "Creando archivo .env desde la variable de entorno..."
          echo $ENV_FILE_BASE64 | base64 --decode > .env
          
      - name: Instalar dependencias de Flutter
        script: |
          flutter packages pub get
          
      - name: Compilar APK / App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab