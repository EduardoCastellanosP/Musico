ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      groups:
        - my_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Decodificar y crear archivo .env
        script: |
          echo "Creando archivo .env desde la variable de entorno..."
          echo $ENV_FILE_BASE64 | base64 --decode > .env
          
      - name: Instalar dependencias de Flutter
        script: |
          flutter packages pub get
          
      - name: Forzar nuevo Bundle ID y Configurar Firma Manual
        script: |
          cd ios
          # Actualizar Bundle ID por si acaso
          grep -rl "vallenatoconnect.vallenatoConnect" . | xargs sed -i 's/vallenatoconnect.vallenatoConnect/mussy.mussyconnect/g'
          grep -rl "com.vallenatoconnect.vallenatoConnect" . | xargs sed -i 's/com.vallenatoconnect.vallenatoConnect/com.mussy.mussyconnect/g'
          
          # Habilitar firma manual y asegurar que Xcode use el perfil correcto
          # (Codemagic expone automáticamente variables para las identidades de firma si están configuradas en su panel web)
          cd ..
          
      - name: Configurar Pods e instalar
        script: |
          find . -name "Podfile" -execdir pod install \;
          
      - name: Compilar iOS con perfiles de Codemagic
        script: |
          # Usamos xcode-project run-workflows o dejamos que flutter compile usando el perfil de aprovisionamiento de Codemagic
          # Asegúrate de usar --release SIN --no-codesign para que Codemagic aplique tus certificados
          flutter build ios --release
    artifacts:
      - build/ios/iphoneos/*.app