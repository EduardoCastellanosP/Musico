workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      groups:
        - my_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Decodificar y crear archivo .env
        script: |
          echo "Creando archivo .env desde la variable de entorno..."
          echo $ENV_FILE_BASE64 | base64 --decode > .env
          
      - name: Instalar dependencias de Flutter
        script: |
          flutter packages pub get
          
      - name: Compilar APK / App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      groups:
        - my_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Decodificar y crear archivo .env
        script: |
          echo "Creando archivo .env desde la variable de entorno..."
          echo $ENV_FILE_BASE64 | base64 --decode > .env
          
      - name: Instalar dependencias de Flutter
        script: |
          flutter packages pub get
          
      - name: Configurar Pods e instalar
        script: |
          find . -name "Podfile" -execdir pod install \;
          
      - name: Compilar iOS (Release)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app