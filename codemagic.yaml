workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    environment:
      groups:
        - my_credentials
      
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mussy.mussyconnect

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Crear archivo .env directamente
        script: |
          echo "Creando archivo .env en la raíz del proyecto..."
          
          cat << 'EOF' > /Users/builder/clone/.env
          SUPABASE_URL=https://kqvnnmswfiitusmvqhpy.supabase.co
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtxdm5ubXN3ZmlpdHVzbXZxaHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NDgzNzgsImV4cCI6MjEwMjMyNDM3OH0.VBJdV9vsy0lj7XM1E8FCCKXwiJEBN2kap_ENxL75qOk
          EOF

          echo "¡Verificando archivo .env creado!"
          ls -la /Users/builder/clone/.env
          cat /Users/builder/clone/.env

      - name: Obtener dependencias Flutter
        script: |
          flutter pub get

      - name: Verificar Bundle ID
        script: |
          echo "======================================"
          echo "BUNDLE ID CONFIGURADO:"
          echo "com.mussy.mussyconnect"
          echo "======================================"

          grep -R "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Instalar CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Configurar firma de iOS
        script: |
          echo "Configurando certificados y provisioning profiles..."
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log