workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60

    environment:
      groups:
        - my_credentials # Grupo donde tienes guardadas tus variables SUPABASE_URL y SUPABASE_ANON_KEY

      flutter: stable
      xcode: latest

    scripts:
      - name: Crear archivo .env
        script: |
          echo "Creando el archivo .env en la raíz del proyecto..."
          pwd
          cat << EOF > .env
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
          ls -la # Verifica que el archivo .env se haya creado correctamente

      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get

      - name: Compilar APK / App Bundle de Android
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab